<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>element³ Ingredient Admin</title>
<style>
  :root {
    --green: #414B3B;
    --green-light: #5a6650;
    --green-bg: #f4f6f2;
    --bg: #f6f6f7;
    --white: #fff;
    --border: #e3e3e3;
    --text: #1a1a1a;
    --text-sub: #6d7175;
    --red: #d72c0d;
    --red-bg: #fef2f2;
    --amber: #b98900;
    --amber-bg: #fdf7e3;
    --teal: #00857c;
    --teal-bg: #e0f5f5;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; font-size: 14px; }

  /* Layout */
  .app { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .header h1 { font-size: 22px; font-weight: 600; }
  .header-sub { color: var(--text-sub); font-size: 14px; }
  .card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 200px; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
  .stat-num { font-size: 28px; font-weight: 700; }
  .stat-label { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .stat-num.green { color: var(--teal); }
  .stat-num.amber { color: var(--amber); }
  .stat-num.red { color: var(--red); }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--white); font-size: 13px; font-weight: 500; transition: all .15s; }
  .btn:hover { background: #f1f1f1; }
  .btn-primary { background: var(--green); color: #fff; border-color: var(--green); }
  .btn-primary:hover { background: var(--green-light); }
  .btn-danger { color: var(--red); border-color: #fecaca; }
  .btn-danger:hover { background: var(--red-bg); }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn-group { display: flex; gap: 8px; }

  /* Forms */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--white); transition: border-color .15s;
  }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--green); }
  .field textarea { resize: vertical; min-height: 80px; }
  .field .help { font-size: 11px; color: var(--text-sub); margin-top: 2px; }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--border); font-weight: 600; font-size: 12px; color: var(--text-sub); text-transform: uppercase; letter-spacing: .5px; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:hover td { background: #fafafa; }
  .name-link { color: var(--green); font-weight: 600; cursor: pointer; text-decoration: none; }
  .name-link:hover { text-decoration: underline; }

  /* Badges */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .badge-green { background: var(--teal-bg); color: var(--teal); }
  .badge-amber { background: var(--amber-bg); color: var(--amber); }
  .badge-red { background: var(--red-bg); color: var(--red); }
  .badge-tag { background: var(--green-bg); color: var(--green); margin-right: 4px; }

  /* Progress bar */
  .progress { height: 6px; background: #e5e5e5; border-radius: 3px; overflow: hidden; width: 100px; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .progress-fill { height: 100%; border-radius: 3px; transition: width .3s; }

  /* Tabs */
  .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 20px; gap: 0; }
  .tab { padding: 10px 20px; font-size: 14px; font-weight: 500; color: var(--text-sub); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--green); border-bottom-color: var(--green); }

  /* Structured editors */
  .item-card { border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 10px; background: #fafafa; }
  .item-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .item-title { font-weight: 600; font-size: 13px; }
  .item-actions { display: flex; gap: 4px; }

  /* Rich text editor */
  .rte-toolbar { display: flex; gap: 4px; padding: 6px; border: 1px solid var(--border); border-bottom: none; border-radius: 8px 8px 0 0; background: #f9f9f9; }
  .rte-toolbar button { padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--white); font-size: 12px; font-weight: 600; }
  .rte-toolbar button:hover { background: #eee; }
  .rte-body { border: 1px solid var(--border); border-radius: 0 0 8px 8px; padding: 12px; min-height: 120px; outline: none; font-size: 14px; line-height: 1.7; }
  .rte-body p { margin-bottom: 8px; }

  /* Toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 10px; color: #fff; font-weight: 500; font-size: 14px; z-index: 9999; animation: fadeIn .2s; }
  .toast-success { background: var(--teal); }
  .toast-error { background: var(--red); }
  @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1000; display: flex; align-items: center; justify-content: center; }
  .modal { background: var(--white); border-radius: 14px; padding: 24px; width: 500px; max-width: 90vw; max-height: 85vh; overflow-y: auto; }
  .modal h2 { margin-bottom: 16px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

  /* Setup screen */
  .setup { max-width: 520px; margin: 80px auto; text-align: center; }
  .setup h1 { font-size: 24px; margin-bottom: 8px; }
  .setup p { color: var(--text-sub); margin-bottom: 24px; }
  .setup .card { text-align: left; }
  .setup ol { padding-left: 20px; font-size: 14px; color: var(--text-sub); margin-bottom: 16px; }
  .setup ol li { margin-bottom: 8px; }

  /* Save bar */
  .save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--green); color: #fff; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; z-index: 100; animation: slideUp .2s; }
  .save-bar .btn { color: var(--green); background: #fff; border-color: #fff; }
  .save-bar .btn-discard { background: transparent; color: #fff; border-color: rgba(255,255,255,.3); }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .loading { text-align: center; padding: 60px; color: var(--text-sub); }
  .empty-state { text-align: center; padding: 40px; color: var(--text-sub); }

  @media (max-width: 768px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .row { flex-direction: column; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ═══════════════════════════════════════════════════════════════════
// element³ Ingredient Admin — Single-file Shopify Admin Tool
// ═══════════════════════════════════════════════════════════════════

const STORE_DOMAIN = 'cf6huz-e6.myshopify.com';
const API_VERSION = '2026-01';

// ─── State ───────────────────────────────────────────────────────
let state = {
  view: 'setup', // setup | dashboard | editor | schema | migration
  token: localStorage.getItem('e3_token') || '',
  storeDomain: localStorage.getItem('e3_store') || STORE_DOMAIN,
  ingredients: [],
  currentIngredient: null,
  currentFields: {},
  originalFields: {},
  definition: null,
  loading: false,
  tab: 0,
  search: '',
  filter: 'all',
  toast: null,
};

// Skip setup when served from a server (token is handled server-side by the proxy)
const isServed = window.location.protocol !== 'file:' && window.location.hostname !== '';
if (state.token || isServed) state.view = 'dashboard';

// ─── Shopify GraphQL ─────────────────────────────────────────────
async function gql(query, variables = {}) {
  const directUrl = `https://${state.storeDomain}/admin/api/${API_VERSION}/graphql.json`;
  const proxyUrl = `/api/graphql`;
  // Use proxy when served from local server OR from Vercel (any non-file:// origin with /api/graphql available)
  const useProxy = window.location.protocol !== 'file:' && window.location.hostname !== '';

  let res;
  try {
    if (useProxy) {
      // Use server-side proxy (local Node server or Vercel serverless function)
      res = await fetch(proxyUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables }),
      });
    } else {
      // Direct call (only works if CORS is allowed)
      res = await fetch(directUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Shopify-Access-Token': state.token },
        body: JSON.stringify({ query, variables }),
      });
    }
  } catch (e) {
    throw new Error('Connection failed. If opening this file directly, you need to run it via the included server. See the README or run: node server.js');
  }
  if (!res.ok) throw new Error(`API error: ${res.status} ${res.statusText}`);
  const json = await res.json();
  if (json.errors) throw new Error(json.errors.map(e => e.message).join('; '));
  return json.data;
}

// ─── API Functions ───────────────────────────────────────────────
async function fetchIngredients() {
  let all = []; let cursor = null; let hasNext = true;
  while (hasNext) {
    const after = cursor ? `, after: "${cursor}"` : '';
    const data = await gql(`{
      metaobjects(type: "ingredient", first: 50${after}, sortKey: "display_name") {
        edges { node {
          id handle displayName updatedAt
          capabilities { publishable { status } }
          name: field(key: "name") { value }
          slug: field(key: "slug") { value }
          category: field(key: "category") { value }
          blend_tags: field(key: "blend_tags") { value }
          subtitle: field(key: "subtitle") { value }
          study_count: field(key: "study_count") { value }
          body_why: field(key: "body_why") { value }
          body_relevant: field(key: "body_relevant") { value }
          faq_items: field(key: "faq_items") { value }
          research_articles: field(key: "research_articles") { value }
          protocol_body: field(key: "protocol_body") { value }
          closing_text: field(key: "closing_text") { value }
          key_facts: field(key: "key_facts") { value }
          food_sources: field(key: "food_sources") { value }
          hero_image: field(key: "hero_image") { value }
          seo_title: field(key: "seo_title") { value }
          seo_description: field(key: "seo_description") { value }
        } cursor }
        pageInfo { hasNextPage }
      }
    }`);
    const edges = data.metaobjects.edges;
    all.push(...edges.map(e => e.node));
    hasNext = data.metaobjects.pageInfo.hasNextPage;
    if (edges.length) cursor = edges[edges.length - 1].cursor;
  }
  return all;
}

async function fetchIngredient(id) {
  const data = await gql(`query($id:ID!){ metaobject(id:$id){ id handle displayName type updatedAt capabilities{publishable{status}} fields{key value type} } }`, { id });
  return data.metaobject;
}

async function updateIngredient(id, fields) {
  const data = await gql(`mutation($id:ID!,$m:MetaobjectUpdateInput!){ metaobjectUpdate(id:$id,metaobject:$m){ metaobject{id handle updatedAt fields{key value type}} userErrors{field message} } }`,
    { id, m: { fields: fields.map(f => ({ key: f.key, value: f.value })), capabilities: { publishable: { status: "ACTIVE" } } } });
  if (data.metaobjectUpdate.userErrors?.length) throw new Error(data.metaobjectUpdate.userErrors.map(e => e.message).join(', '));
  return data.metaobjectUpdate.metaobject;
}

async function createIngredient(name, handle) {
  const data = await gql(`mutation($m:MetaobjectCreateInput!){ metaobjectCreate(metaobject:$m){ metaobject{id handle displayName fields{key value type}} userErrors{field message} } }`,
    { m: { type: "ingredient", handle, capabilities: { publishable: { status: "ACTIVE" } }, fields: [{ key: "name", value: name }, { key: "slug", value: handle }] } });
  if (data.metaobjectCreate.userErrors?.length) throw new Error(data.metaobjectCreate.userErrors.map(e => e.message).join(', '));
  return data.metaobjectCreate.metaobject;
}

async function deleteIngredient(id) {
  const data = await gql(`mutation($id:ID!){ metaobjectDelete(id:$id){ deletedId userErrors{field message} } }`, { id });
  if (data.metaobjectDelete.userErrors?.length) throw new Error(data.metaobjectDelete.userErrors.map(e => e.message).join(', '));
}

async function fetchDefinition() {
  const data = await gql(`{ metaobjectDefinitionByType(type:"ingredient"){ id type fieldDefinitions{ key name description type{name} } access{storefront} } }`);
  return data.metaobjectDefinitionByType;
}

async function addField(defId, field) {
  const data = await gql(`mutation($id:ID!,$d:MetaobjectDefinitionUpdateInput!){ metaobjectDefinitionUpdate(id:$id,definition:$d){ metaobjectDefinition{id fieldDefinitions{key name type{name}}} userErrors{field message} } }`,
    { id: defId, d: { fieldDefinitions: [{ create: { key: field.key, name: field.name, description: field.description || '', type: field.type } }] } });
  if (data.metaobjectDefinitionUpdate.userErrors?.length) throw new Error(data.metaobjectDefinitionUpdate.userErrors.map(e => e.message).join(', '));
  return data.metaobjectDefinitionUpdate.metaobjectDefinition;
}

// ─── Helpers ─────────────────────────────────────────────────────
const REQUIRED = ['name','slug','subtitle','category','blend_tags','body_why','body_relevant','key_facts','food_sources','faq_items','research_articles','protocol_body','closing_text','seo_title','seo_description'];

function completeness(ing) {
  let n = 0;
  for (const k of REQUIRED) { const v = ing[k]?.value; if (v && v !== '[]' && v !== '{}' && v !== 'null') n++; }
  return Math.round((n / REQUIRED.length) * 100);
}

function emptyFields(ing) {
  return REQUIRED.filter(k => { const v = ing[k]?.value; return !v || v === '[]' || v === '{}' || v === 'null'; });
}

function toast(msg, type = 'success') {
  state.toast = { msg, type };
  render();
  setTimeout(() => { state.toast = null; render(); }, 3000);
}

function richTextToHtml(json) {
  if (!json) return '';
  try {
    const obj = JSON.parse(json);
    return rNode(obj);
  } catch { return json; }
}

function rNode(n) {
  if (!n) return '';
  if (n.type === 'text') { let t = esc(n.value || ''); if (n.bold) t = `<strong>${t}</strong>`; if (n.italic) t = `<em>${t}</em>`; return t; }
  const ch = (n.children || []).map(rNode).join('');
  if (n.type === 'root') return ch;
  if (n.type === 'paragraph') return `<p>${ch}</p>`;
  if (n.type === 'heading') return `<h${n.level||2}>${ch}</h${n.level||2}>`;
  if (n.type === 'list') return n.listType === 'ordered' ? `<ol>${ch}</ol>` : `<ul>${ch}</ul>`;
  if (n.type === 'list-item') return `<li>${ch}</li>`;
  if (n.type === 'link') return `<a href="${esc(n.url||'')}">${ch}</a>`;
  return ch;
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function htmlToRichText(html) {
  if (!html?.trim()) return '';
  const div = document.createElement('div'); div.innerHTML = html;
  const raw = [];
  for (const c of div.childNodes) { const n = domToR(c); if (n) raw.push(n); }
  if (!raw.length && html.trim()) raw.push({ type:'paragraph', children:[{type:'text',value:html.replace(/<[^>]*>/g,'')}] });
  // Wrap bare inline nodes (text, link) in paragraphs — Shopify requires block-level root children
  const blockTypes = new Set(['paragraph','heading','list']);
  const children = [];
  let inlineBuf = [];
  function flushInline() { if (inlineBuf.length) { children.push({type:'paragraph',children:inlineBuf}); inlineBuf = []; } }
  for (const n of raw) {
    if (blockTypes.has(n.type)) { flushInline(); children.push(n); }
    else { inlineBuf.push(n); }
  }
  flushInline();
  // Remove empty paragraphs (children with only whitespace text nodes)
  const cleaned = children.filter(n => {
    if (n.type !== 'paragraph') return true;
    return n.children && n.children.some(c => c.type !== 'text' || (c.value && c.value.trim()));
  });
  return JSON.stringify({ type:'root', children: cleaned.length ? cleaned : [{type:'paragraph',children:[{type:'text',value:''}]}] });
}

function domToR(el) {
  if (el.nodeType === 3) { const t = el.textContent; return t.trim() ? { type:'text', value:t } : null; }
  if (el.nodeType !== 1) return null;
  const tag = el.tagName.toLowerCase();
  const ch = Array.from(el.childNodes).map(domToR).filter(Boolean);
  if (tag === 'p' || tag === 'div') return { type:'paragraph', children: ch.length ? ch : [{type:'text',value:''}] };
  if (/^h[1-6]$/.test(tag)) return { type:'heading', level:+tag[1], children:ch };
  if (tag === 'ul') return { type:'list', listType:'unordered', children:ch };
  if (tag === 'ol') return { type:'list', listType:'ordered', children:ch };
  if (tag === 'li') return { type:'list-item', children:ch };
  if (tag === 'strong' || tag === 'b') return ch.map(c => ({...c, bold:true}))[0] || null;
  if (tag === 'em' || tag === 'i') return ch.map(c => ({...c, italic:true}))[0] || null;
  if (tag === 'a') return { type:'link', url:el.getAttribute('href')||'', children:ch };
  if (tag === 'br') return { type:'text', value:'\n' };
  return ch.length === 1 ? ch[0] : ch.length ? { type:'paragraph', children:ch } : null;
}

function safeJSON(val, fallback = []) { try { return JSON.parse(val || JSON.stringify(fallback)); } catch { return fallback; } }

// ─── Render ──────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  if (state.view === 'setup') app.innerHTML = renderSetup();
  else if (state.view === 'dashboard') app.innerHTML = renderDashboard();
  else if (state.view === 'editor') app.innerHTML = renderEditor();
  else if (state.view === 'schema') app.innerHTML = renderSchema();
  else if (state.view === 'migration') app.innerHTML = renderMigration();
  if (state.toast) app.innerHTML += `<div class="toast toast-${state.toast.type}">${state.toast.msg}</div>`;
}

// ─── Setup Screen ────────────────────────────────────────────────
function renderSetup() {
  return `<div class="setup">
    <h1>element³ Ingredient Admin</h1>
    <p>Connect to your Shopify store to manage ingredient pages.</p>
    <div class="card">
      <h2>Setup</h2>
      <ol>
        <li>Go to <strong>Shopify Admin → Settings → Apps and sales channels</strong></li>
        <li>Click <strong>Develop apps</strong> → <strong>Create an app</strong></li>
        <li>Name it "Ingredient Admin"</li>
        <li>Under <strong>Configuration → Admin API</strong>, enable:<br>
          <code>read_metaobjects</code>, <code>write_metaobjects</code>, <code>read_content</code>, <code>write_content</code></li>
        <li>Click <strong>Install app</strong> and copy the <strong>Admin API access token</strong></li>
      </ol>
      <div class="field">
        <label>Store domain</label>
        <input type="text" value="${state.storeDomain}" onchange="state.storeDomain=this.value" placeholder="your-store.myshopify.com">
      </div>
      <div class="field">
        <label>Admin API access token</label>
        <input type="password" value="${state.token}" onchange="state.token=this.value" placeholder="shpat_xxxxxxxxxxxxx">
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px" onclick="connectStore()">Connect</button>
    </div>
  </div>`;
}

async function connectStore() {
  if (!state.token || !state.storeDomain) return;
  state.loading = true; render();
  try {
    await gql(`{ shop { name } }`);
    localStorage.setItem('e3_token', state.token);
    localStorage.setItem('e3_store', state.storeDomain);
    state.view = 'dashboard';
    await loadDashboard();
  } catch (e) {
    toast('Connection failed: ' + e.message, 'error');
    state.loading = false; render();
  }
}

// ─── Dashboard ───────────────────────────────────────────────────
async function loadDashboard() {
  state.loading = true; state.view = 'dashboard'; render();
  try {
    state.ingredients = await fetchIngredients();
  } catch (e) {
    toast('Error loading ingredients: ' + e.message, 'error');
  }
  state.loading = false; render();
}

function renderDashboard() {
  const ings = state.ingredients;
  const complete = ings.filter(i => completeness(i) >= 90).length;
  const partial = ings.filter(i => { const c = completeness(i); return c >= 50 && c < 90; }).length;
  const sparse = ings.filter(i => completeness(i) < 50).length;

  let filtered = [...ings];
  if (state.search) { const q = state.search.toLowerCase(); filtered = filtered.filter(i => (i.name?.value||i.displayName||'').toLowerCase().includes(q)); }
  if (state.filter === 'complete') filtered = filtered.filter(i => completeness(i) >= 90);
  if (state.filter === 'incomplete') filtered = filtered.filter(i => completeness(i) < 90);
  if (state.filter === 'draft') filtered = filtered.filter(i => i.capabilities?.publishable?.status !== 'ACTIVE');

  return `<div class="app">
    <div class="header">
      <div>
        <h1>Ingredient Admin</h1>
        <div class="header-sub">${ings.length} active ingredients · element³</div>
      </div>
      <div class="btn-group">
        <button class="btn" onclick="goMigration()" title="One-time setup: create blend_doses field, Benefit metaobject, hub page metafields, and bulk-populate launch data" style="border-color:#b98900;color:#b98900">⚡ Migration</button>
        <button class="btn" onclick="goSchema()">Manage Fields</button>
        <button class="btn btn-primary" onclick="showNewModal()">+ New Ingredient</button>
        <button class="btn btn-sm" onclick="disconnect()" title="Disconnect">Logout</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-num">${ings.length}</div><div class="stat-label">Total</div></div>

async function openIngredient(id) {
  state.loading = true; state.view = 'editor'; state.tab = 0; render();
  try {
    const ing = await fetchIngredient(id);
    state.currentIngredient = ing;
    const fields = {};
    for (const f of ing.fields) fields[f.key] = f.value || '';
    state.currentFields = fields;
    state.originalFields = JSON.parse(JSON.stringify(fields));
  } catch (e) { toast('Error: ' + e.message, 'error'); }
  state.loading = false; render();
}

function updateField(key, value) {
  state.currentFields[key] = value;
  render();
}

function isDirty() {
  return JSON.stringify(state.currentFields) !== JSON.stringify(state.originalFields);
}

function sanitizeRichText(jsonStr) {
  if (!jsonStr || !jsonStr.trim()) return jsonStr;
  try {
    const obj = JSON.parse(jsonStr);
    if (obj.type !== 'root' || !Array.isArray(obj.children)) return jsonStr;
    const blockTypes = new Set(['paragraph','heading','list']);
    const sanitized = [];
    let inlineBuf = [];
    function flushInline() { if (inlineBuf.length) { sanitized.push({type:'paragraph',children:inlineBuf}); inlineBuf = []; } }
    for (const n of obj.children) {
      if (blockTypes.has(n.type)) { flushInline(); sanitized.push(n); }
      else { inlineBuf.push(n); }
    }
    flushInline();
    // Remove empty paragraphs
    const cleaned = sanitized.filter(n => {
      if (n.type !== 'paragraph') return true;
      return n.children && n.children.some(c => c.type !== 'text' || (c.value && c.value.trim()));
    });
    obj.children = cleaned.length ? cleaned : [{type:'paragraph',children:[{type:'text',value:''}]}];
    return JSON.stringify(obj);
  } catch { return jsonStr; }
}

const RICH_TEXT_FIELDS = new Set(['body_why','body_relevant','protocol_body','closing_text']);

async function saveIngredient() {
  // Sanitize all rich text fields before comparing/saving
  for (const key of RICH_TEXT_FIELDS) {
    if (state.currentFields[key]) state.currentFields[key] = sanitizeRichText(state.currentFields[key]);
  }
  const changed = Object.entries(state.currentFields)
    .filter(([k, v]) => v !== state.originalFields[k])
    .map(([key, value]) => ({ key, value }));
  if (!changed.length) { toast('No changes to save'); return; }
  try {
    await updateIngredient(state.currentIngredient.id, changed);
    state.originalFields = JSON.parse(JSON.stringify(state.currentFields));
    toast('Saved successfully');
    render();
  } catch (e) { toast('Save failed: ' + e.message, 'error'); }
}

function discardChanges() {
  state.currentFields = JSON.parse(JSON.stringify(state.originalFields));
  render();
}

async function doDelete() {
  if (!confirm('Permanently delete this ingredient? This cannot be undone.')) return;
  try {
    await deleteIngredient(state.currentIngredient.id);
    toast('Deleted');
    await loadDashboard();
  } catch (e) { toast('Error: ' + e.message, 'error'); }
}

// JSON field editor: multi-line textarea with Format/Pretty button and validation feedback
function jsonField(key, label) {
  const val = state.currentFields[key] || '';
  const id = 'jf-' + key;
  let isValid = true;
  let parsed = null;
  if (val.trim()) {
    try { parsed = JSON.parse(val); } catch { isValid = false; }
  }
  let pretty = val;
  if (isValid && parsed !== null) {
    try { pretty = JSON.stringify(parsed, null, 2); } catch {}
  }
  const itemCount = Array.isArray(parsed) ? parsed.length : (parsed && typeof parsed === 'object' ? Object.keys(parsed).length : 0);
  return `<div class="field">
    <label style="display:flex;justify-content:space-between;align-items:center">
      <span>${label} <span style="font-weight:normal;color:var(--text-sub);font-size:11px">(JSON${itemCount ? ` · ${itemCount} item${itemCount===1?'':'s'}` : ''})</span></span>
      <span style="display:flex;gap:6px">
        <button type="button" class="btn btn-sm" onclick="formatJsonField('${key}')">Format</button>
        ${isValid ? '<span style="color:var(--teal);font-size:11px;font-weight:600">✓ valid</span>' : '<span style="color:var(--red);font-size:11px;font-weight:600">✗ invalid JSON</span>'}
      </span>
    </label>
    <textarea id="${id}" rows="8" style="font-family:monospace;font-size:12px;line-height:1.5;${isValid?'':'border-color:var(--red)'}" oninput="updateField('${key}',this.value)">${esc(pretty)}</textarea>
    <div class="help">Edit the JSON directly. Click Format to pretty-print. Changes are saved when you click Save Changes.</div>
  </div>`;
}

function formatJsonField(key) {
  const val = state.currentFields[key] || '';
  if (!val.trim()) return;
  try {
    const parsed = JSON.parse(val);
    const pretty = JSON.stringify(parsed, null, 2);
    state.currentFields[key] = pretty;
    render();
  } catch (e) {
    toast('Invalid JSON: ' + e.message, 'error');
  }
}

function addTag(tag) {
  let tags = []; try { tags = JSON.parse(state.currentFields.blend_tags || '[]'); } catch {}
  if (!tags.includes(tag)) { tags.push(tag); updateField('blend_tags', JSON.stringify(tags)); }
}
function removeTag(tag) {
  let tags = []; try { tags = JSON.parse(state.currentFields.blend_tags || '[]'); } catch {}

// JSON array helpers
function addJsonItem(key, template) {
  const items = safeJSON(state.currentFields[key]);
  items.push({...template});
  updateField(key, JSON.stringify(items));
}
function removeJsonItem(key, index) {
  const items = safeJSON(state.currentFields[key]);
  items.splice(index, 1);
  updateField(key, JSON.stringify(items));
}
function updateJsonItem(key, index, field, value) {
  const items = safeJSON(state.currentFields[key]);
  items[index] = { ...items[index], [field]: value };
  state.currentFields[key] = JSON.stringify(items);
  // Don't full re-render to keep focus — just mark dirty
}
function moveJsonItem(key, index, dir) {
  const items = safeJSON(state.currentFields[key]);
  const newIdx = index + dir;
  if (newIdx < 0 || newIdx >= items.length) return;
  [items[index], items[newIdx]] = [items[newIdx], items[index]];
  updateField(key, JSON.stringify(items));
}

function showAddFieldModal() {
  const types = [
    ['single_line_text_field','Single line text'],['multi_line_text_field','Multi-line text'],
    ['rich_text_field','Rich text'],['number_integer','Number (integer)'],['number_decimal','Number (decimal)'],

  ];

  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };

async function doAddField() {
  const key = document.getElementById('af-key').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '_');
  const name = document.getElementById('af-name').value.trim();
  const desc = document.getElementById('af-desc').value.trim();
  const type = document.getElementById('af-type').value;
  if (!key || !name) return;
  try {
    await addField(state.definition.id, { key, name, description: desc, type });
    document.getElementById('modal')?.remove();
    toast('Field "' + name + '" added');
    await goSchema();
  } catch (e) { toast('Error: ' + e.message, 'error'); }
}

let migrationLog = [];
let migrationRunning = false;

function logMigration(line, level) {
  level = level || 'info';
  migrationLog.push({ line, level, ts: new Date().toLocaleTimeString() });
  if (state.view === 'migration') render();
}

async function goMigration() {
  state.view = 'migration';
  migrationLog = [];
  render();
}

function renderMigration() {
  const colors = { info: 'var(--text-sub)', success: 'var(--teal)', error: 'var(--red)', skip: 'var(--amber)' };
  const icons = { info: '·', success: '✓', error: '✗', skip: '○' };

  return `<div class="app">
    <div class="header">
      <div>
        <a onclick="loadDashboard()" style="color:var(--text-sub);cursor:pointer;font-size:13px">← Back to Dashboard</a>
        <h1 style="margin-top:4px">Migration · Our Ingredients hub</h1>
        <div class="header-sub">One-shot setup for the new metaobject schema and launch data</div>
      </div>
      <button class="btn btn-primary" onclick="runMigration()" ${migrationRunning ? 'disabled' : ''}>${migrationRunning ? 'Running…' : '▶ Run Migration'}</button>
    </div>

    <div class="card">

      <ol style="padding-left:20px;font-size:13px;color:var(--text-sub);line-height:1.7">

      </div>
    </div>

    <div class="card">

async function runMigration() {
  if (migrationRunning) return;
  migrationRunning = true;
  migrationLog = [];
  render();

  try {
    logMigration('Starting migration…', 'info');

    logMigration('Stage 1/5: Ensuring blend_doses field on Ingredient metaobject…', 'info');
    await ensureBlendDosesField();

    logMigration('Stage 2/5: Ensuring Benefit metaobject definition…', 'info');
    const benefitDefId = await ensureBenefitDefinition();

    logMigration('Stage 3/5: Ensuring ingredients_hub page metafield definitions…', 'info');
    await ensureHubMetafieldDefinitions();

    logMigration('Stage 4/5: Populating blend_doses for launch ingredients…', 'info');
    await populateBlendDoses();

    logMigration('Stage 5/5: Creating Benefit entries…', 'info');
    await createBenefitEntries(benefitDefId);

    logMigration('Migration complete. Reload your Our Ingredients page.', 'success');
    toast('Migration completed successfully');
  } catch (e) {
    logMigration('Migration halted: ' + e.message, 'error');
    toast('Migration failed — see log', 'error');
  } finally {
    migrationRunning = false;
    render();
  }
}

async function ensureBlendDosesField() {
  const def = await fetchDefinition();
  const existing = (def.fieldDefinitions || []).find(f => f.key === 'blend_doses');
  if (existing) {
    logMigration('blend_doses field already present — skipping', 'skip');
    return;
  }
  await addField(def.id, {
    key: 'blend_doses',
    name: 'Blend doses',
    description: 'Per-blend dose, RDI, regulatory max, and typical-diet data. Array of {blend, category, dose, rdi, rdi_pct, typical_diet, warning} objects.',
    type: 'json',
  });
  logMigration('blend_doses field added to Ingredient definition', 'success');
}

async function ensureBenefitDefinition() {
  const lookup = await gql(`{ metaobjectDefinitionByType(type: "benefit") { id type fieldDefinitions { key name type { name } } } }`);
  if (lookup.metaobjectDefinitionByType) {
    logMigration('Benefit metaobject definition already exists — skipping', 'skip');
    return lookup.metaobjectDefinitionByType.id;
  }

  const ingredientDef = await fetchDefinition();
  const ingredientDefId = ingredientDef.id;

  const data = await gql(`
    mutation CreateDef($definition: MetaobjectDefinitionCreateInput!) {
      metaobjectDefinitionCreate(definition: $definition) {
        metaobjectDefinition { id type fieldDefinitions { key name type { name } } }
        userErrors { field message code }
      }
    }
  `, {
    definition: {
      name: "Benefit",
      type: "benefit",
      access: { storefront: "PUBLIC_READ" },
      capabilities: { publishable: { enabled: true } },
      fieldDefinitions: [
        { key: "title", name: "Title", type: "single_line_text_field", required: true },
        { key: "slug", name: "Slug", type: "single_line_text_field", required: true },
        { key: "blend", name: "Blend", type: "single_line_text_field", required: true,
          description: "One of: rise, reset, rest" },
        { key: "description", name: "Description", type: "multi_line_text_field" },
        { key: "display_order", name: "Display order", type: "number_integer" },
        { key: "ingredients", name: "Ingredients", type: "list.metaobject_reference",
          validations: [{ name: "metaobject_definition_id", value: ingredientDefId }] },
      ],
    },
  });

  const errs = data.metaobjectDefinitionCreate.userErrors || [];
  if (errs.length) throw new Error('Benefit definition: ' + errs.map(e => e.message).join('; '));

  const newDef = data.metaobjectDefinitionCreate.metaobjectDefinition;
  logMigration('Benefit metaobject definition created with 6 fields', 'success');
  return newDef.id;
}

async function ensureHubMetafieldDefinitions() {
  const NS = 'ingredients_hub';
  const wanted = [
    { key: 'hero_intro', name: 'Hero intro', type: 'multi_line_text_field',
      description: 'Hero paragraph on Our Ingredients hub' },
    { key: 'stat_ingredients', name: 'Stat: ingredients', type: 'number_integer',
      description: 'Headline stat — total active ingredients' },
    { key: 'stat_blends', name: 'Stat: blends', type: 'number_integer',
      description: 'Headline stat — number of daily blends' },
    { key: 'stat_studies', name: 'Stat: studies', type: 'number_integer',
      description: 'Headline stat — total studies reviewed' },
    { key: 'sources_html', name: 'Sources & notes (HTML)', type: 'multi_line_text_field',
      description: 'Footnotes block at the bottom of the blend tables' },
  ];

  const existing = await gql(`
    { metafieldDefinitions(first: 100, ownerType: PAGE, namespace: "${NS}") {
        edges { node { key name type { name } } }
    } }
  `);
  const have = new Set((existing.metafieldDefinitions.edges || []).map(e => e.node.key));

  for (const f of wanted) {
    if (have.has(f.key)) {
      logMigration(`metafield ${NS}.${f.key} already exists — skipping`, 'skip');
      continue;
    }
    const data = await gql(`
      mutation CreateMfd($definition: MetafieldDefinitionInput!) {
        metafieldDefinitionCreate(definition: $definition) {
          createdDefinition { id key namespace }
          userErrors { field message code }
        }
      }
    `, {
      definition: {
        name: f.name,
        namespace: NS,
        key: f.key,
        type: f.type,
        ownerType: "PAGE",
        description: f.description || '',
      },
    });
    const errs = data.metafieldDefinitionCreate.userErrors || [];
    if (errs.length) throw new Error(`metafield ${f.key}: ` + errs.map(e => e.message).join('; '));
    logMigration(`metafield ${NS}.${f.key} created`, 'success');
  }

  const pageRes = await gql(`{ pages(first: 50) { edges { node { id handle title } } } }`);
  const pageEdge = (pageRes.pages.edges || []).find(e => /our.?ingredients/i.test(e.node.handle));
  if (!pageEdge) {
    logMigration('Could not find Page with handle "our-ingredients" — skipping value population. Create the page in Shopify admin then re-run migration.', 'error');
    return;
  }
  const pageId = pageEdge.node.id;

  const valuesByKey = {
    hero_intro: MIGRATION_DATA.page_metafields.hero_intro,
    stat_ingredients: String(MIGRATION_DATA.page_metafields.stat_ingredients),
    stat_blends: String(MIGRATION_DATA.page_metafields.stat_blends),
    stat_studies: String(MIGRATION_DATA.page_metafields.stat_studies),
    sources_html: MIGRATION_DATA.page_metafields.sources_html,
  };
  const typesByKey = {
    hero_intro: 'multi_line_text_field',
    stat_ingredients: 'number_integer',
    stat_blends: 'number_integer',
    stat_studies: 'number_integer',
    sources_html: 'multi_line_text_field',
  };

  const metafields = Object.keys(valuesByKey).map(k => ({
    ownerId: pageId,
    namespace: NS,
    key: k,
    type: typesByKey[k],
    value: valuesByKey[k],
  }));

  const setRes = await gql(`
    mutation SetMfs($metafields: [MetafieldsSetInput!]!) {
      metafieldsSet(metafields: $metafields) {
        metafields { id key namespace }
        userErrors { field message code }
      }
    }
  `, { metafields });

  const setErrs = setRes.metafieldsSet.userErrors || [];
  if (setErrs.length) {
    logMigration('metafieldsSet warnings: ' + setErrs.map(e => `${e.field?.join('.')}: ${e.message}`).join('; '), 'error');
  } else {
    logMigration(`Set ${metafields.length} metafield values on page "${pageEdge.node.title}"`, 'success');
  }
}

async function populateBlendDoses() {
  const ingredients = await fetchIngredients();
  const byCanonical = new Map();

  for (const ing of ingredients) {
    const candidates = [ing.name?.value, ing.displayName].filter(Boolean);
    for (const c of candidates) byCanonical.set(c.trim(), ing);
  }

  let matched = 0, skipped = 0, failed = 0;
  const missing = [];

  for (const canonical of Object.keys(MIGRATION_DATA.ingredient_doses)) {
    const doses = MIGRATION_DATA.ingredient_doses[canonical];
    const ing = byCanonical.get(canonical);
    if (!ing) {
      missing.push(canonical);
      continue;
    }

    let alreadySet = false;
    try {
      const single = await fetchIngredient(ing.id);
      const f = (single.fields || []).find(x => x.key === 'blend_doses');
      const val = f?.value;
      if (val && val !== '' && val !== '[]' && val !== 'null') alreadySet = true;
    } catch (e) { /* ignore */ }

    if (alreadySet) {
      logMigration(`blend_doses for "${canonical}" already set — skipping`, 'skip');
      skipped++;
      continue;
    }

    try {
      await updateIngredient(ing.id, [{ key: 'blend_doses', value: JSON.stringify(doses) }]);
      logMigration(`Set blend_doses on "${canonical}" (${doses.length} blend${doses.length>1?'s':''})`, 'success');
      matched++;
    } catch (e) {
      logMigration(`Failed to update "${canonical}": ${e.message}`, 'error');
      failed++;
    }
  }

  if (missing.length) {
    logMigration(`No metaobject found for: ${missing.join(', ')}. Add them with "+ New Ingredient" then re-run.`, 'error');
  }
  logMigration(`Stage 4 summary: ${matched} updated, ${skipped} skipped, ${failed} failed, ${missing.length} missing`, matched > 0 ? 'success' : 'info');
}

async function createBenefitEntries(benefitDefId) {
  const ingredients = await fetchIngredients();
  const byCanonical = new Map();
  for (const ing of ingredients) {
    if (ing.name?.value) byCanonical.set(ing.name.value.trim(), ing);
    if (ing.displayName) byCanonical.set(ing.displayName.trim(), ing);
  }

  // Fetch existing Benefits with their current ingredient list (so we can detect mismatches)
  const existing = await gql(`
    { metaobjects(type: "benefit", first: 50) {
        edges { node {
          id handle
          slug: field(key: "slug") { value }
          ingredients: field(key: "ingredients") { value }
        } }
    } }
  `);
  const existingBySlug = new Map();
  for (const e of (existing.metaobjects?.edges || [])) {
    const slug = e.node.slug?.value || e.node.handle;
    if (slug) existingBySlug.set(slug, e.node);
  }

  let created = 0, updated = 0, skipped = 0, failed = 0;
  const missingIngs = new Set();

  for (const ben of MIGRATION_DATA.benefits) {
    // Resolve canonical names → ingredient GIDs
    const ingredientGids = [];
    for (const name of (ben.ingredient_names || [])) {
      const ing = byCanonical.get(name);
      if (ing) ingredientGids.push(ing.id);
      else missingIngs.add(name);
    }

    const existingBen = existingBySlug.get(ben.slug);
    if (existingBen) {
      // Already exists — check if ingredient list matches; if not, update
      let currentGids = [];
      try { currentGids = JSON.parse(existingBen.ingredients?.value || '[]'); } catch {}
      const sameLength = currentGids.length === ingredientGids.length;
      const sameSet = sameLength && currentGids.every(g => ingredientGids.includes(g));
      if (sameSet) {
        logMigration(`Benefit "${ben.title}" already correct (${ingredientGids.length} ingredients) — skipping`, 'skip');
        skipped++;
        continue;
      }
      // Update ingredient list
      try {
        const data = await gql(`
          mutation Update($id: ID!, $m: MetaobjectUpdateInput!) {
            metaobjectUpdate(id: $id, metaobject: $m) {
              metaobject { id handle }
              userErrors { field message code }
            }
          }
        `, {
          id: existingBen.id,
          m: { fields: [{ key: "ingredients", value: JSON.stringify(ingredientGids) }] },
        });
        const errs = data.metaobjectUpdate.userErrors || [];
        if (errs.length) throw new Error(errs.map(e => e.message).join('; '));
        logMigration(`Updated benefit "${ben.title}" ingredients (was ${currentGids.length}, now ${ingredientGids.length})`, 'success');
        updated++;
      } catch (e) {
        logMigration(`Failed to update benefit "${ben.title}": ${e.message}`, 'error');
        failed++;
      }
      continue;
    }

    // Doesn't exist — create
    try {
      const data = await gql(`
        mutation Create($metaobject: MetaobjectCreateInput!) {
          metaobjectCreate(metaobject: $metaobject) {
            metaobject { id handle }
            userErrors { field message code }
          }
        }
      `, {
        metaobject: {
          type: "benefit",
          handle: ben.slug,
          capabilities: { publishable: { status: "ACTIVE" } },
          fields: [
            { key: "title", value: ben.title },
            { key: "slug", value: ben.slug },
            { key: "blend", value: ben.blend },
            { key: "description", value: ben.description || '' },
            { key: "display_order", value: String(ben.display_order || 99) },
            { key: "ingredients", value: JSON.stringify(ingredientGids) },
          ],
        },
      });
      const errs = data.metaobjectCreate.userErrors || [];
      if (errs.length) throw new Error(errs.map(e => e.message).join('; '));
      logMigration(`Created benefit "${ben.title}" with ${ingredientGids.length} ingredients`, 'success');
      created++;
    } catch (e) {
      logMigration(`Failed to create benefit "${ben.title}": ${e.message}`, 'error');
      failed++;
    }
  }

  if (missingIngs.size) {
    logMigration(`Benefit ingredient names without matching metaobject: ${[...missingIngs].join(', ')}. They were skipped from the linked-ingredient lists.`, 'error');
  }
  logMigration(`Stage 5 summary: ${created} created, ${updated} updated, ${skipped} skipped, ${failed} failed`, (created + updated) > 0 ? 'success' : 'info');
}

render();
